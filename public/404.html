<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@kalasoo</title>
  <meta name="description" content="Personal blog of Yin Ming - exploring the intersection of technology and humanity">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/icon.png">
  <script>
    window.location.replace('/');
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f2f2;
      --surface: #ffffff;
      --text: #111111;
      --text-2: #525252;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --surface: #161616;
        --text: #f5f5f5;
        --text-2: #a8a8a8;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(100%, 30rem);
      padding: clamp(2rem, 8vw, 3rem) clamp(1.5rem, 6vw, 2.5rem);
      border-radius: 2.5rem;
      background: var(--surface);
      text-align: center;
    }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(2.25rem, 10vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: .95;
    }

    p {
      margin: 0 0 1.5rem;
      color: var(--text-2);
      line-height: 1.6;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 2.5rem;
      padding: .55rem 1.15rem;
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      font-size: .85rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>这个页面不存在，正在带你回到首页。<br>This page does not exist — taking you home.</p>
    <a class="chip" href="/">Back home</a>
  </div>
</body>
</html>
